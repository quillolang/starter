# Checks the program and serves it, on Linux, macOS and Windows, with the quillo
# release get-quillo.sh names. Kept when you start from this repository: it
# checks your program the same way.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Quillo, the release this program is written for
        if: runner.os != 'Windows'
        run: sh get-quillo.sh
      - name: Quillo, the release this program is written for (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\get-quillo.ps1

      - name: Check
        shell: bash
        run: .quillo/bin/quillo check

      # Through the script get-quillo wrote: run.sh, or run.cmd on Windows.
      - name: Serve, with run.sh
        if: runner.os != 'Windows'
        run: ./run.sh --port 8080 --log off &
      - name: Serve, with run.cmd
        if: runner.os == 'Windows'
        shell: powershell
        run: Start-Process -FilePath .\run.cmd -ArgumentList '--port', '8080', '--log', 'off' -NoNewWindow
      - name: It answers
        shell: bash
        run: |
          for i in $(seq 1 100); do curl -fs -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.1; done
          curl -fsS -o /dev/null -w "GET / %{http_code}\n" http://127.0.0.1:8080/

      # The starter's own page and route, which an app made from it changes.
      - name: The starter's page
        if: github.repository == 'quillolang/starter'
        shell: bash
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q 'data-c="Counter"'
          test "$(curl -fsS http://127.0.0.1:8080/hello/Ana)" = "Hello, Ana!"
